<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Hitesh</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>

<body>

  

        <!-- AUTO PLAY MUSIC -->
        <audio id="birthdaySong" loop>

            <source
              src="./barbie.mp3"
              type="audio/mpeg"
            >
          
          </audio>
      
       
  <!-- BALLOONS -->
  <div class="balloons">
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
    <div class="balloon b5"></div>
  </div>

  <!-- STARS -->
  <div class="stars"></div>

  <!-- MAIN CARD -->

  <section class="birthday-section">

    <div class="birthday-card">

      <h2>
        No matter how much I roast you...
      </h2>

      <p class="line">
        You’ll always be my favorite idiot 💙
      </p>

      <h1>
        🎂✨ Happy Birthday,<br>
        Hitesh (Yeduuuu)! 💗✨🎂
      </h1>

      <p class="wish">
        May your happiness always run in an
        <span>infinite loop ♾️</span>
        <br>
        and may all your problems
        <span>return null</span>
      </p>

     

    </div>

  </section>

  <!-- CONFETTI -->
  <canvas id="confetti"></canvas>

  <script src="script.js"></script>

</body>
</html>
